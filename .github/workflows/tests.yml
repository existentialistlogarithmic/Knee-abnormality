name: tests

# Runs on every push. No secrets, no network, no competition data — the Phase 0
# scripts are exercised against the synthetic fixture in tests/fixture.py.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check eda src tests

      - name: Test
        run: pytest tests -q

      - name: Confirm no patient-derived file is tracked in git
        run: |
          set -e
          # Anything matching these patterns must be ignored, never committed.
          bad=$(git ls-files | grep -E '\.(dcm|dicom|nii|npy|npz|parquet|pt|pth|ckpt)$' || true)
          csv=$(git ls-files '*.csv' | grep -v '^src/lexicons/' | grep -v '^docs/' || true)
          if [ -n "$bad$csv" ]; then
            echo "::error::patient-derived files are tracked in git:"
            printf '%s\n' "$bad" "$csv"
            exit 1
          fi
          echo "clean: no patient-derived files tracked"
